---
name: CI

on:
  push:
    branches: [main]
    paths:
      - 'roles/**'
      - 'molecule/**'
      - '.github/**'
  pull_request:
    branches: [main]
    paths:
      - 'roles/**'
      - 'molecule/**'
  workflow_dispatch:
    inputs:
      test_role:
        description: 'Service role to test (mariadb, podman, etc.)'
        required: false
        default: 'mariadb'

jobs:
  molecule:
    strategy:
      matrix:
        platform: ['uut-ct0', 'uut-ct1', 'uut-ct2']
      fail-fast: false
      max-parallel: 3
    uses: jackaltx/solti-matrix-mgr/.github/workflows/molecule-test.yml@ci-sprint
    with:
      platform: ${{ matrix.platform }}
      artifact_prefix: "ensemble"
      container_runtime: "podman"
      extra_pip: "podman molecule[podman]"
      install_podman: true
      molecule_test_role: ${{ github.event.inputs.test_role || 'mariadb' }}
    secrets: inherit

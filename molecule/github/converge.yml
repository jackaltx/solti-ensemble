---
- name: Converge
  hosts: all
  become: true

  vars:
    test_role: "{{ lookup('env', 'MOLECULE_TEST_ROLE') | default('mariadb', true) }}"
    mariadb_state: present
    mysql_password: ""
    mariadb_security: false

  tasks:
    - name: Load shared test configuration
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/shared/vars/test-config.yml"

    - name: "Run role: {{ test_role }}"
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/{{ test_role }}"

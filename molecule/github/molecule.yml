---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    ignore-errors: true

driver:
  name: podman
  options:
    managed: true
    platform_name: ${MOLECULE_PLATFORM_NAME:-all}

platforms:
  - name: "uut-ct0"
    image: "ghcr.io/jackaltx/testing-containers/debian-ssh:12"
    command: "/sbin/init"
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    ssh_host: "127.0.0.1"
    ssh_port: 2223
    ssh_user: "root"
    connection: ssh

  - name: "uut-ct1"
    image: "ghcr.io/jackaltx/testing-containers/rocky-ssh:9"
    command: "/sbin/init"
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    ssh_host: "127.0.0.1"
    ssh_port: 2222
    ssh_user: "root"
    connection: ssh

  - name: "uut-ct2"
    image: "ghcr.io/jackaltx/testing-containers/ubuntu-ssh:24"
    command: "/sbin/init"
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    ssh_host: "127.0.0.1"
    ssh_port: 2224
    ssh_user: "root"
    connection: ssh

provisioner:
  name: ansible
  env:
    ANSIBLE_FORCE_COLOR: "1"
  log: true
  config_options:
    defaults:
      interpreter_python: auto_silent
      host_key_checking: false
      remote_tmp: /tmp/ansible-tmp
      local_tmp: /tmp/ansible-tmp
  playbooks:
    create: "../shared/podman/create.yml"
    prepare: "../shared/podman/prepare.yml"
    converge: "converge.yml"
    verify: "verify.yml"
    destroy: "../shared/podman/destroy.yml"
  inventory:
    group_vars:
      all:
        ansible_become: false

scenario:
  name: github
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible

---
- name: Create Podman containers
  hosts: localhost
  gather_facts: false
  vars:
    domain: "{{ lookup('env', 'LAB_TLD') | default('a0a0.org', true) }}"
    molecule_inventory:
      all:
        hosts: {}
        molecule: {}

  tasks:
    - name: Create podman network if not exists
      containers.podman.podman_network:
        name: "{{ item.network }}"
        state: present
      loop: "{{ molecule_yml.platforms }}"
      when:
        - item.network is defined
        - item.network != ''

    - name: Login to Gitea registry
      containers.podman.podman_login:
        registry: "gitea.{{ domain }}"
        username: "{{ lookup('env', 'GITEA_USER') }}"
        password: "{{ lookup('env', 'GITEA_PASSWD') }}"
      no_log: "{{ secure_logging | default(true) }}"
      when: lookup('env', 'GITEA_PASSWD') != ''

    - name: Create container
      containers.podman.podman_container:
        name: "{{ item.name }}"
        image: "{{ item.image | regex_replace('\\{\\{ domain \\}\\}', domain) }}"
        state: started
        network: "{{ item.network }}"
        log_driver: json-file
        privileged: "{{ item.privileged | default(true) }}"
        cgroupns: host
        volumes: "{{ item.volumes | default([]) }}"
        command: "{{ item.command | default('/sbin/init') }}"
        publish: "{{ item.published_ports | default([]) }}"
        security_opt:
          - label=disable
      register: result
      loop: "{{ molecule_yml.platforms }}"

    - name: Fail if container is not running
      ansible.builtin.fail:
        msg: "Container {{ item.container.Name }} exited with code {{ item.container.State.ExitCode }}"
      when: >
        item.container.State.ExitCode != 0 or
        not item.container.State.Running
      loop: "{{ result.results }}"
      loop_control:
        label: "{{ item.container.Name }}"

    - name: Add container to molecule_inventory
      vars:
        # SSH port is derived from published_ports[0] ("2223:22" → 2223)
        ssh_port: "{{ item.published_ports[0].split(':')[0] | int if item.published_ports is defined and item.published_ports | length > 0 else omit }}"
        inventory_partial_yaml: |
          all:
            children:
              molecule:
                hosts:
                  "{{ item.name }}":
                    ansible_connection: ssh
                    ansible_host: "127.0.0.1"
                    ansible_port: {{ ssh_port }}
                    ansible_user: jackaltx
      ansible.builtin.set_fact:
        molecule_inventory: >
          {{ molecule_inventory | combine(inventory_partial_yaml | from_yaml) }}
      loop: "{{ molecule_yml.platforms }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Dump molecule_inventory
      ansible.builtin.copy:
        content: |
          {{ molecule_inventory | to_yaml }}
        dest: "{{ molecule_ephemeral_directory }}/inventory/molecule_inventory.yml"
        mode: "0600"

    - name: Force inventory refresh
      ansible.builtin.meta: refresh_inventory

    - name: Fail if molecule group is missing
      ansible.builtin.assert:
        that: "'molecule' in groups"
        fail_msg: "molecule group was not found inside inventory groups: {{ groups }}"
      run_once: true

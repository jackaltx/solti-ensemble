---
- name: Verify
  hosts: "{{ lookup('env', 'MOLECULE_PLATFORM_NAME', default='all') }}"
  become: true

  tasks:
    - name: Load shared test configuration
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/shared/vars/test-config.yml"
      delegate_to: localhost
      run_once: true

    - name: Show platform info
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} | {{ ansible_distribution }} {{ ansible_distribution_version }} | {{ ansible_os_family }}"

    # Podman verification — Rocky/RHEL only
    - name: Verify podman installation (RHEL only)
      when: ansible_os_family == "RedHat"
      block:
        - name: Check podman binary
          ansible.builtin.command: which podman
          changed_when: false

        - name: Check podman version
          ansible.builtin.command: podman --version
          register: podman_version
          changed_when: false

        - name: Check podman info (root context — avoids rootless XDG_RUNTIME_DIR requirement)
          ansible.builtin.command: podman info
          register: podman_info
          changed_when: false

        - name: Verify crun is installed
          ansible.builtin.command: which crun
          changed_when: false

        - name: Verify subuid mapping exists for jackaltx
          ansible.builtin.command: grep jackaltx /etc/subuid
          register: subuid_check
          changed_when: false

        - name: Verify site-registries.conf.d was deployed
          ansible.builtin.stat:
            path: /etc/containers/registries.conf.d
          register: registries_dir

        - name: Assert registries directory exists
          ansible.builtin.assert:
            that: registries_dir.stat.exists
            fail_msg: "/etc/containers/registries.conf.d was not created by role"

        - name: Summary
          ansible.builtin.debug:
            msg:
              - "Podman: {{ podman_version.stdout }}"
              - "subuid: {{ subuid_check.stdout }}"
              - "registries.conf.d: present"

    - name: Skip notice for non-RHEL platforms
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: podman role not tested on {{ ansible_os_family }} (use Docker role for Debian/Ubuntu)"
      when: ansible_os_family != "RedHat"

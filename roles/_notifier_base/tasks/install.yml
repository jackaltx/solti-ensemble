---
- name: Create solti shared lib directory
  ansible.builtin.file:
    path: "{{ notifier_lib_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy notifier library
  ansible.builtin.copy:
    src: notifier.py
    dest: "{{ notifier_lib_dir }}/notifier.py"
    owner: root
    group: root
    mode: "0644"

- name: Install base Python dependencies
  ansible.builtin.package:
    name:
      - python3
      - python3-requests
    state: present

---
# ─────────────────────────────────────────────────────────────────────────────
# Gate: check whether sshd is present and running before touching anything.
# Containers and hosts without sshd get a clear advisory and skip cleanly.
# ─────────────────────────────────────────────────────────────────────────────
- name: Check sshd binary is present
  ansible.builtin.command: which sshd
  changed_when: false
  failed_when: false
  register: _sshd_binary

- name: Check sshd service is active
  ansible.builtin.command: systemctl is-active {{ sshd_harden_service_name }}
  changed_when: false
  failed_when: false
  register: _sshd_active

- name: Advise and skip when sshd is not running
  ansible.builtin.debug:
    msg: >-
      sshd_harden skipped on {{ inventory_hostname }}:
      sshd binary {{ 'found' if _sshd_binary.rc == 0 else 'NOT found' }},
      service {{ _sshd_active.stdout | default('unknown') }}.
      Install and start sshd, then rerun to apply hardening.
  when: _sshd_binary.rc != 0 or _sshd_active.stdout != 'active'

- name: Apply SSH hardening
  when: _sshd_binary.rc == 0 and _sshd_active.stdout == 'active'
  block:
    - name: Generate RSA 4096 key pair for root
      community.crypto.openssh_keypair:
        path: /root/.ssh/id_rsa
        type: rsa
        size: 4096
        owner: root
        group: root
        mode: "0600"
        force: false

    - name: Generate ED25519 key pair for root
      community.crypto.openssh_keypair:
        path: /root/.ssh/id_ed25519
        type: ed25519
        owner: root
        group: root
        mode: "0600"
        force: false

    - name: Ensure sshd_config.d directory exists
      ansible.builtin.file:
        path: "{{ sshd_harden_config_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy SSH hardening configuration
      ansible.builtin.copy:
        src: solti.conf
        dest: "{{ sshd_harden_config_file }}"
        owner: root
        group: root
        mode: "0644"
        backup: true
      register: _config_deployed

    - name: Filter weak DH moduli (keep only >= {{ sshd_harden_moduli_min_bits }} bits)
      ansible.builtin.shell:
        cmd: |
          if [ -f /etc/ssh/moduli ]; then
            awk '$5 >= {{ sshd_harden_moduli_min_bits }}' /etc/ssh/moduli > /etc/ssh/moduli.tmp && \
            mv /etc/ssh/moduli.tmp /etc/ssh/moduli
          fi
        creates: /etc/ssh/moduli.filtered
      register: _moduli_filtered

    - name: Create moduli filter marker file
      ansible.builtin.file:
        path: /etc/ssh/moduli.filtered
        state: touch
        owner: root
        group: root
        mode: "0644"
      when: _moduli_filtered is changed

    - name: Validate SSH configuration syntax
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false
      check_mode: false

    # ── Staged restart advisory ──────────────────────────────────────────────
    # We do NOT restart sshd automatically. Restarting the daemon that carries
    # the current Ansible connection on a remote host risks lockout if the
    # hardened config is incompatible with the client. Instead we record that
    # a restart is pending and tell the operator what to do next.
    - name: Record restart pending
      ansible.builtin.set_fact:
        sshd_restart_pending: "{{ _config_deployed is changed or _moduli_filtered is changed }}"

    - name: Advisory — restart required to activate hardening
      ansible.builtin.debug:
        msg: >-
          SSH hardening config deployed and validated on {{ inventory_hostname }}.
          A service restart is required to activate the new settings.
          Verify you can still connect with your current SSH client, then run:
            tasks_from: apply_restart
          to restart sshd and activate the hardening.
      when:
        - sshd_restart_pending | bool
        - not sshd_harden_skip_restart_advisory | bool

    - name: Config already up to date
      ansible.builtin.debug:
        msg: "SSH hardening config is current on {{ inventory_hostname }} — no restart needed."
      when: not sshd_restart_pending | bool

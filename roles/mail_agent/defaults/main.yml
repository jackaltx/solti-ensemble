---
# defaults file for mail_agent

mail_agent_state: present           # present | absent

mail_agent_user: mailagent
mail_agent_groups: []
mail_agent_ssh_public_key: ""      # required
mail_agent_ssh_source: ""          # optional — agent IP or CIDR for from= restriction;
                                   # if empty, key-only auth (restrict) applies with no IP limit
mail_agent_allow_delete: false     # controls the wrapper's delete action
mail_agent_allow_restart: true     # controls the systemctl restart rules

# no_log standard — set false to debug credential tasks
mail_agent_no_log: "{{ mylab_nolog | default(true) }}"

# Status timer
mail_agent_status_timer_state: absent   # set present to enable status timer
mail_agent_status_interval: "10min"     # OnUnitActiveSec interval
mail_agent_status_log_lines: 200        # lines of mail journal to parse for auth failures
